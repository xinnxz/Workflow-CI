name: Retraining Pipeline and Docker Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train_and_deploy:
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install mlflow==2.19.0 scikit-learn pandas

      - name: Run MLflow Project
        run: |
          # Perintah ini akan membaca MLproject dan mengeksekusi modelling.py
          mlflow run MLProject --env-manager=local

      - name: Upload Artifact to Google Drive / GitHub Release
        run: |
          echo "Simulating upload of mlruns to remote storage..."

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          # Cari ID run terakhir (32 karakter hex)
          RUN_ID=$(ls -1t mlruns/0 | grep -E '^[a-f0-9]{32}$' | head -1)
          echo "Found RUN_ID: $RUN_ID"
          ls -la "mlruns/0/$RUN_ID/artifacts/model/"

          # Buat Dockerfile manual (menggantikan mlflow build-docker yang bermasalah di Python 3.9)
          cat > Dockerfile <<'EOF'
          FROM python:3.12-slim
          RUN pip install --no-cache-dir mlflow==2.19.0 scikit-learn pandas
          COPY mlruns/0/$RUN_ID/artifacts/model /opt/ml/model
          EXPOSE 8080
          CMD ["mlflow", "models", "serve", "-m", "/opt/ml/model", "-h", "0.0.0.0", "-p", "8080", "--env-manager=local"]
          EOF

          # Ganti variabel $RUN_ID di dalam Dockerfile
          sed -i "s|\$RUN_ID|$RUN_ID|g" Dockerfile

          # Build dan Push Docker Image
          docker build -t "${{ secrets.DOCKER_USERNAME }}/breast-cancer-model:latest" .
          docker push "${{ secrets.DOCKER_USERNAME }}/breast-cancer-model:latest"
