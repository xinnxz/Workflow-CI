name: Retraining Pipeline and Docker Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train_and_deploy:
    runs-on: ubuntu-latest

    env:
      # Paksa MLflow menyimpan semua data ke folder lokal di runner GitHub
      MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install mlflow==2.19.0 scikit-learn pandas

      - name: Run MLflow Project
        run: |
          # Perintah ini akan membaca MLproject dan mengeksekusi modelling.py
          mlflow run MLProject --env-manager=local

      - name: Upload Artifact to Google Drive / GitHub Release
        run: |
          echo "Simulating upload of mlruns to remote storage..."
          # Anda bisa menambahkan script Google Drive API atau actions/upload-artifact di sini

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image using MLflow
        run: |
          # Cari ID run terakhir yang berhasil dibuat di folder mlruns
          RUN_ID=$(ls -t mlruns/0/ | grep -v meta.yaml | head -1)
          echo "Found RUN_ID: $RUN_ID"

          # Pastikan folder artifacts/model ada
          ls -la "mlruns/0/$RUN_ID/artifacts/model/"

          # Build Docker image langsung dari model MLflow
          mlflow models build-docker -m "mlruns/0/$RUN_ID/artifacts/model" -n "${{ secrets.DOCKER_USERNAME }}/breast-cancer-model:latest"

      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/breast-cancer-model:latest
