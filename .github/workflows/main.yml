name: Retraining Pipeline and Docker Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install MLflow
        run: pip install mlflow==2.19.0

      - name: Run MLflow Project
        run: |
          # Perintah ini akan membaca MLproject dan mengeksekusi modelling.py
          mlflow run MLProject --no-conda
          
      - name: Upload Artifact to Google Drive / GitHub Release
        run: |
          echo "Simulating upload of mlruns to remote storage..."
          # Anda bisa menambahkan script Google Drive API atau actions/upload-artifact di sini

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image using MLflow
        run: |
          # Cari ID run terakhir yang berhasil dibuat di folder mlruns
          RUN_ID=$(ls -td mlruns/0/* | head -1 | basename)
          
          # Build Docker image langsung dari model MLflow
          mlflow models build-docker -m "mlruns/0/$RUN_ID/artifacts/model" -n "${{ secrets.DOCKER_USERNAME }}/breast-cancer-model:latest"
          
      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/breast-cancer-model:latest
